name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  acceptance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [terraform, tofu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        if: matrix.engine == 'terraform'
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v1
        if: matrix.engine == 'tofu'
        with:
          tofu_version: '1.6.3'
          tofu_wrapper: false
      - name: Run acceptance suite
        shell: bash
        env:
          TF_ACC: '1'
          TF_ACC_TERRAFORM_PATH: ${{ matrix.engine }}
          TF_ACC_PROVIDER_HOST: ${{ matrix.engine == 'tofu' && 'registry.opentofu.org' || 'registry.terraform.io' }}
          TF_ACC_PROVIDER_NAMESPACE: vappcloud
        run: go test -v -timeout 30m ./internal/provider -run '^TestAcc'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Assert forbidden secret fields are absent
        run: |
          ! grep -RInE 'enrollment_(token|data)|bootstrap_data|secret_value|cloud_credential' --include='*.go' internal/provider
