name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - uses: anchore/sbom-action/download-syft@v0
      - name: Import registry signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Resolve signing fingerprint
        run: |
          echo "GPG_FINGERPRINT=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.17.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip
      - name: Publish identical mirror release
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_MIRROR_TOKEN }}
        run: ./scripts/publish-mirror.sh "${GITHUB_REF_NAME}"
